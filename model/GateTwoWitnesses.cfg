\* Settings for GateTwoWitnesses.tla, the backup-witness model: two actions,
\* each proposed once (the module header says why two). The spec allows at
\* most one crash of the gate and one of each witness.
\* TLC's deadlock check stays on, as it is by default. Do not run TLC with
\* -deadlock.
SPECIFICATION
    Spec
CONSTANTS
    Actions = {a1, a2}
\* Rules checked in every state.
INVARIANTS
    TypeOK
    Rule1
    Check3
    RefusedNeverRuns
    StampsOnlyFromAsked
\* Rules about steps, in box form.
PROPERTIES
    Rule1Step
    Rule2
    RunNeedsHeldStamp
    CrashRefusesUndecided
    JournalBeforeSend
