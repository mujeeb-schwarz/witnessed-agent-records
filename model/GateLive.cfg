\* Settings for GateLive.tla: the smaller model for the liveness rule. Two
\* actions, each proposed once; the spec still allows at most one crash of
\* the gate and one of the witness. TLC's deadlock check stays on.
SPECIFICATION
    LiveSpec
CONSTANTS
    Actions = {a1, a2}
INVARIANTS
    TypeOK
\* The rule about "eventually": every proposed action is eventually decided.
PROPERTIES
    EveryProposedDecided
