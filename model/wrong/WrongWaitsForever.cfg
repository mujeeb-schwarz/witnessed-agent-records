\* Settings for WrongWaitsForever.tla: the same smaller model and liveness
\* rule as GateLive.cfg, with the wrong gate's spec.
\* Expected: TLC reports EveryProposedDecided broken: an action can wait
\* forever once its fingerprint or its stamp is lost.
\* Run TLC with -deadlock for this file only. With the deadlock check on,
\* TLC stops first at the stuck state, which is the same hang seen as a
\* deadlock; the flag lets it go on to the liveness rule this file tests.
SPECIFICATION
    WrongLiveSpec
CONSTANTS
    Actions = {a1, a2}
INVARIANTS
    TypeOK
PROPERTIES
    EveryProposedDecided
