\* Settings for Gate.tla. The sizes, from the design statement: three actions,
\* each proposed once. The spec itself allows at most one crash of the gate
\* and one of the witness.
\* TLC's deadlock check stays on, as it is by default: a state where no step
\* is possible before every action is decided shows as a deadlock. It does
\* not show a gate that waits forever, since the gate can always give up;
\* GateLive checks that. Do not run TLC with -deadlock.
SPECIFICATION
    Spec
CONSTANTS
    Actions = {a1, a2, a3}
\* Rules checked in every state.
INVARIANTS
    TypeOK
    Rule1
    Check3
    RefusedNeverRuns
\* Rules about steps, in box form.
PROPERTIES
    Rule1Step
    Rule2
    RunNeedsHeldStamp
    CrashRefusesUndecided
    JournalBeforeSend
